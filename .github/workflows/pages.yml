name: Deploy Sphinx Docs to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: sphinx/pyproject.toml

      - name: Install dependencies
        run: uv sync --directory sphinx --group docs

      - name: Build documentation
        run: uv run --directory sphinx sphinx-build -b html -c . ../content build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: sphinx/build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
